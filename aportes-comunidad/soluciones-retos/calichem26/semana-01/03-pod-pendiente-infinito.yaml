# 🚨 RETO 3 (Nivel Medio): El Pod demasiado exigente 🚨
# Síntoma: El Pod se crea, pero se queda en estado 'Pending' para siempre y nunca arranca.
# Pista: El Scheduler está buscando un servidor libre pero ninguno cumple los requisitos.
# Ejecuta 'kubectl describe pod reto-03-exigente' y mira por qué el Scheduler lo rechazó.

apiVersion: v1
kind: Pod
metadata:
  name: reto-03-exigente
  labels:
    reto: "3"
spec:
  containers:
    - name: app-glotona
      image: nginx:alpine
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"

# Reto 03
# El Pod permanecia en Pending porque solicitaba 64 CPU y 500Gi de RAM. con el comando kubectl describe pod reto-03-exigente
# Warning  FailedScheduling  18s   default-scheduler  0/3 nodes are available: 3 Insufficient cpu, 3 Insufficient memory. preemption: 0/3 nodes are available: 3 Preemption is not helpful for scheduling.
# Se ajustaron los request a 100m de CPU y 256Mi de memoria, se elimina el pod kubectl delete pod reto-03-exigente y se vuelve aplicar el yaml para que tome los cambios