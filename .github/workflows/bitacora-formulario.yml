name: 📔 Bitácora Semanal y Portafolio Automático desde Formulario (Issue Form)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  procesar-bitacora:
    name: Generar Bitácora, Actualizar Portafolio y Responder con Badges
    if: contains(github.event.issue.labels.*.name, 'bitacora-semanal') || startsWith(github.event.issue.title, '📔 Bitácora')
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 🛠️ Crear bitacora.md, actualizar Portafolio Profesional y sincronizar ASISTENTES.md
        id: bitacora
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {
              WEEK_METADATA,
              cleanGithubUser,
              buildShareLinks,
              syncAllFiles
            } = require('./scripts/generar-asistentes.js');

            const issue = context.payload.issue;
            const authorUser = issue.user.login;
            const body = issue.body || '';

            function extractField(labelFragment, preserveNewlines = true) {
              const regex = new RegExp(`###\\s+.*${labelFragment}.*\\r?\\n+([\\s\\S]*?)(?=\\r?\\n###\\s+|$)`, 'i');
              const match = body.match(regex);
              if (!match) return '';
              let val = match[1].trim();
              if (val.toLowerCase() === '_no response_' || val.toLowerCase() === 'no response') {
                return '';
              }
              // Si GitHub envolvió el bloque con ```bash ... ``` por el atributo render: bash, limpiar cercas exteriores
              val = val.replace(/^```[a-zA-Z]*\r?\n([\s\S]*?)\r?\n```$/m, '$1').trim();
              return preserveNewlines ? val : val.replace(/\r?\n/g, ' ').trim();
            }

            const githubInput = extractField('Usuario de GitHub', false);
            const user = cleanGithubUser(githubInput, authorUser);
            const semanaRaw = extractField('semana estás documentando', false) || 'semana-00';
            const weekMatch = semanaRaw.match(/(semana-\d+)/i);
            const weekKey = weekMatch ? weekMatch[1].toLowerCase() : 'semana-00';
            const weekMeta = WEEK_METADATA[weekKey] || { title: semanaRaw };

            const aprendizaje = extractField('aprendiste esta semana') || '- Conceptos fundamentales de contenedores y Kubernetes.';
            const desafio = extractField('retador o qué error') || '- Diagnóstico y resolución de manifiestos en el laboratorio.';
            const comandos = extractField('Comandos o herramientas');
            const aplicacion = extractField('aplicarías esto');

            const solBaseDir = path.join('aportes-comunidad', 'soluciones-retos');
            if (!fs.existsSync(solBaseDir)) {
              fs.mkdirSync(solBaseDir, { recursive: true });
            }

            const existingDirs = fs.readdirSync(solBaseDir, { withFileTypes: true });
            const foundUserDir = existingDirs.find(d => d.isDirectory() && d.name.toLowerCase() === user.toLowerCase());
            const userFolderName = foundUserDir ? foundUserDir.name : user;
            const userDirPath = path.join(solBaseDir, userFolderName);
            const weekDirPath = path.join(userDirPath, weekKey);
            fs.mkdirSync(weekDirPath, { recursive: true });

            const today = new Date().toISOString().split('T')[0];
            const comandosBlock = comandos
              ? `\`\`\`bash\n${comandos}\n\`\`\``
              : `\`\`\`bash\nkubectl get pods -o wide\nkubectl describe pod <nombre-pod>\n\`\`\``;
            const aplicacionBlock = aplicacion || 'Seguir practicando en los laboratorios del workshop y aplicando buenas prácticas Cloud Native.';

            const bitacoraMarkdown = `# 📔 Bitácora de Aprendizaje — ${weekMeta.title}

> ⛵ **Tripulante:** [\`@${userFolderName}\`](https://github.com/${userFolderName})  
> 🗓️ **Fecha de registro:** \`${today}\`  
> 🎓 **Portafolio Principal:** [⬅️ Volver a mi Portafolio Profesional K8s](../README.md)

---

## 1️⃣ 💡 ¿Qué aprendí esta semana?

${aprendizaje}

---

## 2️⃣ 🧩 ¿Qué fue lo más retador y cómo lo resolví?

${desafio}

---

## 3️⃣ 💻 Comandos y herramientas que practiqué

${comandosBlock}

---

## 4️⃣ 🚀 Aplicación real y próximos pasos

${aplicacionBlock}

---

<div align="center">
  <sub>🏔️☕ Bitácora registrada en <b><a href="https://github.com/${context.repo.owner}/${context.repo.repo}">De Cero a Capitán en Kubernetes — Cloud Native Medellín (CNCF)</a></b></sub>
</div>
`;

            const bitacoraFilePath = path.join(weekDirPath, 'bitacora.md');
            fs.writeFileSync(bitacoraFilePath, bitacoraMarkdown, 'utf8');

            let data = JSON.parse(fs.readFileSync('asistentes.json', 'utf8'));
            const existingIndex = data.findIndex(item => item.github.toLowerCase() === user.toLowerCase());
            if (existingIndex < 0) {
              data.push({
                github: userFolderName,
                nombre: issue.user.name || userFolderName,
                rol: 'Tripulante de la Comunidad',
                linkedin: '',
                redes: [],
                rango: '⛵ Marinero',
                motivacion: `Construyendo mi Portafolio Cloud Native en KubeCafé (${weekKey}).`
              });
            }

            const { students } = syncAllFiles(data);
            const currentStudent = students.find(s => s.github.toLowerCase() === user.toLowerCase());
            const xp = currentStudent ? currentStudent.puntos : 10;
            const rango = currentStudent ? currentStudent.rango : '⛵ Marinero';
            const nombre = currentStudent ? currentStudent.nombre : userFolderName;

            core.setOutput('user', userFolderName);
            core.setOutput('nombre', nombre);
            core.setOutput('week_key', weekKey);
            core.setOutput('week_title', weekMeta.title);
            core.setOutput('xp', xp.toString());
            core.setOutput('rango', rango);

      - name: 💾 Guardar bitácora y portafolio en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aportes-comunidad/soluciones-retos/ asistentes.json ASISTENTES.md README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs(portafolio): registrar bitácora ${WEEK_KEY} y actualizar portafolio de @${GH_USER} [skip ci]"
            git pull --rebase origin ${{ github.event.repository.default_branch }}
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
        env:
          GH_USER: ${{ steps.bitacora.outputs.user }}
          WEEK_KEY: ${{ steps.bitacora.outputs.week_key }}

      - name: 🎉 Publicar Portafolio e Insignias para Redes Sociales y cerrar Issue
        uses: actions/github-script@v9
        env:
          GH_USER: ${{ steps.bitacora.outputs.user }}
          NOMBRE: ${{ steps.bitacora.outputs.nombre }}
          WEEK_KEY: ${{ steps.bitacora.outputs.week_key }}
          WEEK_TITLE: ${{ steps.bitacora.outputs.week_title }}
          XP: ${{ steps.bitacora.outputs.xp }}
          RANGO: ${{ steps.bitacora.outputs.rango }}
        with:
          script: |
            const { buildShareLinks } = require('./scripts/generar-asistentes.js');
            const user = process.env.GH_USER || '';
            const nombre = process.env.NOMBRE || user;
            const weekKey = process.env.WEEK_KEY || 'semana-00';
            const weekTitle = process.env.WEEK_TITLE || weekKey;
            const xp = parseInt(process.env.XP || '10', 10);
            const rango = process.env.RANGO || '⛵ Marinero';

            const share = buildShareLinks(user, nombre, rango, xp, true, user);
            const bitacoraUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/aportes-comunidad/soluciones-retos/${user}/${weekKey}/bitacora.md`;

            const comment = [
              `### 📔 ¡Excelente trabajo, **${nombre}** (@${user})! Tu Bitácora de Navegación y Portafolio KubeCafé ya están publicados 🏔️☕`,
              '',
              `Tu reflexión de **${weekTitle}** ha sido guardada y tu **Portafolio Profesional de Kubernetes — Cloud Native Medellín** se ha actualizado automáticamente:`,
              '',
              `- 🎓 **[Abrir mi Portafolio Profesional K8s](\`${ user }/README.md\`)](${share.portfolioUrl})**`,
              `- 📔 **[Ver mi Bitácora de ${weekKey}](${bitacoraUrl})**`,
              `- 🎖️ **Rango actual:** **${rango}** (**${xp} XP**)`,
              '',
              '---',
              '',
              '### 📣 ¡Comparte tu logro e Insignia en tus Redes Sociales con 1 clic!',
              '',
              share.badgesBar,
              '',
              '#### 📋 Texto sugerido para publicar en LinkedIn:',
              '```text',
              share.shareMessage,
              '```',
              '',
              '#### 🐙 Insignia para el `README.md` de tu perfil personal de GitHub:',
              '```markdown',
              share.githubProfileSnippet,
              '```',
              '',
              '> 💡 *Cerramos este ticket automáticamente porque tu bitácora y tu portafolio ya quedaron publicados en el repositorio. Puedes volver a usar este formulario cada semana para documentar nuevos aprendizajes.*'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: comment
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

