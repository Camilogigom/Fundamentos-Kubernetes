name: 🏆 Gamificación - Evaluar Ejercicios y Actualizar Ranking Automáticamente

on:
  push:
    branches: [main, master]
    paths:
      - 'aportes-comunidad/**'
      - 'asistentes.json'
      - 'ASISTENTES.md'
      - 'scripts/generar-asistentes.js'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número de Pull Request opcional para evaluar y publicar comentario (ej: 45 o 49)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  actualizar-rango:
    name: Evaluar Ejercicios y Actualizar Ranking en ASISTENTES.md
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 🎖️ Evaluar ejercicios completados y actualizar ranking
        id: calcular
        uses: actions/github-script@v9
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const {
              INSTRUCTORS,
              cleanLinkedin,
              discoverOfficialChallenges,
              evaluateUserProgress,
              syncAllFiles
            } = require('./scripts/generar-asistentes.js');

            let pr = null;
            const inputPrNum = (process.env.INPUT_PR_NUMBER || '').trim();

            if (inputPrNum && /^\d+$/.test(inputPrNum)) {
              const { data: fetchedPr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: parseInt(inputPrNum, 10)
              });
              pr = fetchedPr;
            } else {
              const { data: associatedPrs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha
              });
              if (associatedPrs && associatedPrs.length > 0) {
                pr = associatedPrs.find(p => p.merged_at) || associatedPrs[0];
              }
            }

            let data = JSON.parse(fs.readFileSync('asistentes.json', 'utf8'));
            let mdBefore = fs.readFileSync('ASISTENTES.md', 'utf8');
            let readmeBefore = fs.existsSync('README.md') ? fs.readFileSync('README.md', 'utf8') : '';

            if (!pr) {
              console.log('Sincronizando ranking general sin PR específico asociado.');
              syncAllFiles(data);
              const mdAfter = fs.readFileSync('ASISTENTES.md', 'utf8');
              const readmeAfter = fs.existsSync('README.md') ? fs.readFileSync('README.md', 'utf8') : '';
              core.setOutput('has_updates', (mdBefore !== mdAfter || readmeBefore !== readmeAfter) ? 'true' : 'false');
              core.setOutput('user', 'comunidad');
              core.setOutput('new_rank', '⛵ Tripulación');
              core.setOutput('points', '');
              core.setOutput('pr_number', '');
              core.setOutput('report', '');
              return;
            }

            const user = pr.user.login;

            if (pr.user.type === 'Bot' || user.includes('[bot]')) {
              console.log('Ignorando bots de GitHub');
              core.setOutput('has_updates', 'false');
              core.setOutput('points', '');
              return;
            }

            const instructors = [...INSTRUCTORS, context.repo.owner.toLowerCase()];
            if (instructors.includes(user.toLowerCase())) {
              console.log(`Ignorando instructor @${user}: no participa en la tabla de puntajes.`);
              syncAllFiles(data);
              const mdAfter = fs.readFileSync('ASISTENTES.md', 'utf8');
              const readmeAfter = fs.existsSync('README.md') ? fs.readFileSync('README.md', 'utf8') : '';
              core.setOutput('has_updates', (mdBefore !== mdAfter || readmeBefore !== readmeAfter) ? 'true' : 'false');
              core.setOutput('user', user);
              core.setOutput('new_rank', '⚓ Capitán K8s');
              core.setOutput('points', '');
              core.setOutput('pr_number', '');
              core.setOutput('report', '');
              return;
            }

            // Detectar si agregaron fila manual en ASISTENTES.md
            let manualEntry = null;
            for (const line of mdBefore.split('\n')) {
              if (
                line.trim().startsWith('|') &&
                (line.toLowerCase().includes(user.toLowerCase()) || line.includes('TU-USUARIO'))
              ) {
                const parts = line.split('|').map(p => p.trim());
                if (parts.length >= 6) {
                  const nameMatch = (parts[1] + ' ' + parts[2]).match(/\*\*(.+?)\*\*/);
                  const linkedinMatch = line.match(/linkedin\.com\/[^\s)"]+/i);
                  manualEntry = {
                    github: user,
                    nombre: nameMatch ? nameMatch[1].trim() : user,
                    rol: parts[2] || 'Tripulante de la Comunidad',
                    linkedin: linkedinMatch ? cleanLinkedin('https://' + linkedinMatch[0]) : '',
                    redes: [],
                    rango: '⛵ Marinero',
                    motivacion: parts[parts.length - 2] || `Aporte en PR #${pr.number}: ${pr.title.replace(/\|/g, '')}`
                  };
                }
              }
            }

            const existingIndex = data.findIndex(item => item.github.toLowerCase() === user.toLowerCase());
            if (existingIndex < 0) {
              data.push(
                manualEntry || {
                  github: user,
                  nombre: pr.user.name || user,
                  rol: 'Tripulante de la Comunidad',
                  linkedin: '',
                  redes: [],
                  rango: '⛵ Marinero',
                  motivacion: `Aporte en PR #${pr.number}: ${pr.title.replace(/\|/g, '')}`
                }
              );
            }

            const officialChallenges = discoverOfficialChallenges();
            const userEval = evaluateUserProgress(user, officialChallenges);

            syncAllFiles(data);

            const mdAfter = fs.readFileSync('ASISTENTES.md', 'utf8');
            const readmeAfter = fs.existsSync('README.md') ? fs.readFileSync('README.md', 'utf8') : '';

            const reportLines = userEval.detailedReport
              .filter(r => r.solvedCount > 0)
              .map(r => {
                const earnedXp = r.solvedCount * 10;
                if (r.isComplete) {
                  return `- ✅ **${r.weekKey}:** \`${r.solvedCount}/${r.totalExpected} retos validados\` *(¡Semana 100% completada! +${earnedXp} XP)*`;
                }
                return `- ⏳ **${r.weekKey}:** \`${r.solvedCount}/${r.totalExpected} retos validados\` *(+${earnedXp} XP — Faltan por resolver/corregir: ${r.missingNums.join(', ')})*`;
              });

            const reportMarkdown =
              reportLines.length > 0
                ? reportLines.join('\n')
                : '- 📝 **Registro en el Muro de la Tripulación:** `+10 XP`';

            core.setOutput('has_updates', (mdBefore !== mdAfter || readmeBefore !== readmeAfter) ? 'true' : 'false');
            core.setOutput('user', user);
            core.setOutput('new_rank', userEval.rango);
            core.setOutput('points', userEval.points.toString());
            core.setOutput('pr_number', pr.number.toString());
            core.setOutput('report', reportMarkdown);

      - name: 💾 Guardar cambios en el repositorio
        if: steps.calcular.outputs.has_updates == 'true'
        env:
          GH_USER: ${{ steps.calcular.outputs.user }}
          POINTS: ${{ steps.calcular.outputs.points }}
          NEW_RANK: ${{ steps.calcular.outputs.new_rank }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add asistentes.json ASISTENTES.md README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(gamificacion): actualizar puntaje de @${GH_USER} (${POINTS:-10} XP - ${NEW_RANK}) [skip ci]"
            git pull --rebase origin "${DEFAULT_BRANCH}"
            git push origin HEAD:"${DEFAULT_BRANCH}"
          fi

      - name: 📣 Publicar reporte de evaluación y puntaje en el Pull Request
        if: steps.calcular.outputs.pr_number != '' && steps.calcular.outputs.points != ''
        uses: actions/github-script@v9
        env:
          GH_USER: ${{ steps.calcular.outputs.user }}
          PR_NUMBER: ${{ steps.calcular.outputs.pr_number }}
          NEW_RANK: ${{ steps.calcular.outputs.new_rank }}
          POINTS: ${{ steps.calcular.outputs.points }}
          REPORT: ${{ steps.calcular.outputs.report }}
        with:
          script: |
            const user = process.env.GH_USER || '';
            const prNumber = parseInt(process.env.PR_NUMBER || '0', 10);
            const rank = process.env.NEW_RANK || '';
            const points = process.env.POINTS || '';
            const report = process.env.REPORT || '';

            if (!points || !prNumber) return;

            const comment = [
              `### 🏆 ¡Felicidades @${user}! Tu Pull Request ha sido fusionado con éxito.`,
              '',
              '📊 **Reporte de Evaluación de tus Ejercicios y Puntaje:**',
              `- 🎖️ **Rango actual:** **${rank}**`,
              `- ⚡ **Puntaje Total:** **${points} XP**`,
              '',
              '#### 📋 Detalle por semana:',
              report,
              '',
              `> 💡 *Recuerda: Cada reto roto resuelto y validado suma **+10 XP**. Para que una semana cuente como **100% Completada** (necesario para ascender a **🧭 Timonel** y **⚓ Capitán K8s**), debes incluir la solución de **todos los ejercicios** de esa semana dentro de tu carpeta \`aportes-comunidad/soluciones-retos/${user}/semana-XX/\`.*`,
              '',
              `👉 **[Ver la Tabla de Posiciones en ASISTENTES.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/ASISTENTES.md)**`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
