# 🚨 RETO 2 (Nivel Medio): El Despliegue Fallido y el Bloqueo de Réplicas 🚨
# Síntoma: Al hacer 'kubectl apply', el Deployment se crea pero NUNCA queda en estado Ready.
#          'kubectl get deployments' muestra '0/3 READY' y los Pods entran en 'ImagePullBackOff'.
#
# Pista: Revisa qué imagen se configuró en el contenedor. Si la etiqueta no existe en el Registry,
#        el Deployment se queda esperando eternamente.
# Misión: Cambia la imagen por una imagen válida y funcional (por ejemplo 'nginx:alpine')
#         para que las 3 réplicas alcancen el estado '3/3 READY'.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: reto-02-imagen
  labels:
    reto: "2"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tienda-online
  template:
    metadata:
      labels:
        app: tienda-online
    spec:
      containers:
        - name: app
          image: nginx:version-fantasma-prod-999
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
